name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          find . -name "*.sh" -type f -exec shellcheck {} \;
          find iso/airootfs/usr/local/bin -type f -exec shellcheck {} \;

  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check package list
        run: |
          echo "Checking packages.x86_64..."
          if [ -f iso/packages.x86_64 ]; then
            echo "✓ packages.x86_64 exists"
            wc -l iso/packages.x86_64
          else
            echo "✗ packages.x86_64 not found"
            exit 1
          fi

      - name: Check profiledef.sh
        run: |
          echo "Checking profiledef.sh..."
          if [ -f iso/profiledef.sh ]; then
            bash -n iso/profiledef.sh && echo "✓ profiledef.sh syntax OK"
          else
            echo "✗ profiledef.sh not found"
            exit 1
          fi

      - name: Check documentation
        run: |
          echo "Checking documentation..."
          for doc in README.md QUICKSTART.md ROADMAP.md CHANGELOG.md; do
            if [ -f "$doc" ]; then
              echo "✓ $doc exists"
            else
              echo "✗ $doc not found"
              exit 1
            fi
          done

  # Note: Actual ISO build requires Arch Linux
  # This is a placeholder for future Docker-based builds
  build-check:
    name: Build System Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check build script
        run: |
          bash -n scripts/build.sh && echo "✓ build.sh syntax OK"
          bash -n scripts/clean.sh && echo "✓ clean.sh syntax OK"
          bash -n scripts/test-vm.sh && echo "✓ test-vm.sh syntax OK"

      - name: Check required files
        run: |
          required_files=(
            "iso/profiledef.sh"
            "iso/packages.x86_64"
            "iso/pacman.conf"
            "scripts/build.sh"
          )

          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✓ $file exists"
            else
              echo "✗ $file missing"
              exit 1
            fi
          done

  documentation:
    name: Check Documentation Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Lint markdown files
        run: |
          markdownlint '**/*.md' --ignore node_modules --ignore .github || true

      - name: Check for broken links (basic)
        run: |
          echo "Checking for common broken link patterns..."
          ! grep -r "](http" --include="*.md" . | grep -E "\]\(http[^)]*\s" || {
            echo "Found malformed links with spaces"
            exit 1
          }
