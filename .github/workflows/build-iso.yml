name: Build PRIZM NAS ISO

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Update system and install dependencies
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm archiso

    - name: Remove community repo
      run: |
        sed -i '/^\[community\]/,/^$/d' /etc/pacman.conf

    - name: Build ISO
      run: |
        mkarchiso -v -w work -o output iso

    - name: Check ISO size
      run: |
        ls -lh output/*.iso
        du -h output/*.iso

    - name: Upload ISO artifact
      uses: actions/upload-artifact@v4
      with:
        name: prizm-nas-iso
        path: output/*.iso
        retention-days: 30
